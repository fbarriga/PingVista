name: Android release build

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    environment: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.6.4

      - name: Verify Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pingvista-upload.jks"

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json

      - name: Generate native Android project
        run: npx expo prebuild --platform android

      - name: Build signed release bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/pingvista-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -PPINGVISTA_UPLOAD_STORE_FILE="$KEYSTORE_FILE" \
            -PPINGVISTA_UPLOAD_STORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PPINGVISTA_UPLOAD_KEY_ALIAS="$KEY_ALIAS" \
            -PPINGVISTA_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pingvista-upload.jks"

      - name: Remove decoded google-services.json
        if: always()
        run: rm -f google-services.json

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingvista-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Attach AAB to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/bundle/release/app-release.aab
          generate_release_notes: true
